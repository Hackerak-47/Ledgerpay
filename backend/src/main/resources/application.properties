spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerpay}
spring.datasource.username=${DB_USERNAME:ledgerpay}
spring.datasource.password=${DB_PASSWORD:ledgerpay_secret}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-ledgerpay-dev-only-change-in-prod}
jwt.expiration-ms=3600000
fraud.max-transfers-per-minute=5
fraud.large-transfer-threshold=10000
rate-limit.requests-per-minute=60
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
