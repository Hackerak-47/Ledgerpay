# ─────────────────────────────────────────────────────────────────────────────
# LedgerPay — Local In-Memory Development Profile (Zero External Dependencies)
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:ledgerpay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ledgerpay
spring.datasource.password=ledgerpay_secret

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled for in-memory H2 profile; schema initialized via JPA ddl-auto and DataLoader
spring.flyway.enabled=false

jwt.secret=your-256-bit-secret-key-for-ledgerpay-dev-only-change-in-prod
jwt.expiration-ms=3600000

fraud.max-transfers-per-minute=5
fraud.large-transfer-threshold=10000
rate-limit.requests-per-minute=60
server.port=8080

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
