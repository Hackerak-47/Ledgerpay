version: '3.8'

# LedgerPay — Local Development Infrastructure
# This file runs only PostgreSQL. The backend and frontend run directly on your machine.
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerpay
      POSTGRES_USER: ledgerpay
      POSTGRES_PASSWORD: ledgerpay_secret
    ports:
      - "5432:5432"
    volumes:
      - ledgerpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpay -d ledgerpay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ledgerpay_pgdata:
    driver: local
